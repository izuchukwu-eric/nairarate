name = "nairarate"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Created with: wrangler kv namespace create RATES_KV
# Paste the returned id below.
[[kv_namespaces]]
binding = "RATES_KV"
id = "cb4ecede9b554dab8bba6a900a50327e"

# Created with: wrangler d1 create nairarate
# Paste the returned database_id below, then: npm run db:init
[[d1_databases]]
binding = "RATES_DB"
database_name = "nairarate"
database_id = "4bc7660c-89b9-44c8-8b63-5c06a6665a01"

[triggers]
# */15 * * * *   -> Monierate sync (parallel + crypto street) + daily roll-up
# 0 7,12 * * 1-5 -> CBN sync (official) + roll-up + prune
#
# Twice daily, not once: CBN publishes around 07:00 UTC but not reliably before it.
# With a single 07:00 trigger, a late publication was not collected until 07:00 the
# next day, serving day-old official rates for ~24h on a product whose whole claim
# is rate accuracy. The second pass at 12:00 UTC costs nothing — CBN is free.
#
# These strings are matched exactly by the `scheduled` handler in src/index.ts.
# Changing one without the other silently stops a sync from ever running.
crons = ["*/15 * * * *", "0 7,12 * * 1-5"]

[vars]
ENVIRONMENT = "production"
# The network real payments settle on. Deliberately a var, not a secret: a secret
# of the same name silently overrides this with no warning and renders as
# "(hidden)" in deploy output, which would leave the setting that decides whether
# real money moves invisible in both the repo and the logs.
# Local development overrides this to base-sepolia via .dev.vars.
X402_NETWORK = "base"

[observability]
enabled = true

# Secrets — set via `wrangler secret put <NAME>`, never committed:
#   MONIERATE_API_KEY     Monierate API key
#   X402_WALLET_ADDRESS   USDC-on-Base address that receives payments. Without it,
#                         /v1/* fails closed with 503 rather than serving free.
#
# No facilitator credentials are needed: a resource server verifies and settles
# through the facilitator and never signs. See src/payment/x402.ts.
